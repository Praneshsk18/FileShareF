@if (auth.isLoggedIn()) {
  <div class="min-h-screen bg-[#F5EFE3] flex flex-col">
    <!-- Glass Navigation Bar -->
    <header class="sticky top-0 z-40 glass-nav">
      <div class="mx-auto max-w-6xl px-4 h-14 flex items-center justify-between">
        <!-- Brand -->
        <div class="flex items-center gap-2.5">
          <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-[#4F5B2A] text-[#F5EFE3] shadow-sm">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <span class="font-semibold text-[#4F5B2A] tracking-tight text-sm sm:text-base">FileShare</span>
        </div>

        <!-- Navigation Pill -->
        <nav class="flex items-center rounded-full bg-[#D8C9A8]/40 border border-[#D8C9A8]/70 px-1 py-0.5 backdrop-blur-md">
          <a
            routerLink="/upload"
            routerLinkActive="!bg-[#4F5B2A] !text-[#F5EFE3] shadow-sm"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center gap-1 rounded-full px-3 py-1 text-xs sm:text-sm font-medium text-[#4F5B2A]/80 transition-colors press-tactile">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>Upload</span>
          </a>
          <a
            routerLink="/files"
            routerLinkActive="!bg-[#4F5B2A] !text-[#F5EFE3] shadow-sm"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center gap-1 rounded-full px-3 py-1 text-xs sm:text-sm font-medium text-[#4F5B2A]/80 transition-colors press-tactile">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Files</span>
          </a>
        </nav>

        <!-- User & Logout -->
        <div class="flex items-center gap-2.5">
          <div class="flex items-center gap-1.5 rounded-full bg-[#F5EFE3] border border-[#D8C9A8] px-2.5 py-0.5 text-xs text-[#4F5B2A]">
            <span class="flex h-3.5 w-3.5 items-center justify-center rounded-full bg-[#B8892D] text-[9px] font-bold text-[#F5EFE3]">
              {{ auth.username().charAt(0).toUpperCase() }}
            </span>
            <span class="font-medium">{{ auth.username() }}</span>
          </div>
          <button
            (click)="auth.logout()"
            class="flex h-7 items-center gap-1 rounded-full px-2 text-xs text-[#4F5B2A]/70 hover:text-[#964230] hover:bg-[#D8C9A8]/30 transition-colors press-tactile">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span class="hidden sm:inline">Sign out</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="mx-auto max-w-5xl flex-1 px-4 sm:px-6 py-8 sm:py-12">
      <router-outlet />
    </main>
  </div>
} @else {
  <main class="min-h-screen bg-[#F5EFE3]">
    <router-outlet />
  </main>
}
